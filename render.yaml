services:
  - type: web
    name: huawei-iotda-web-console
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: HWCLOUD_REGION_ID
        sync: false
      - key: HWCLOUD_ENDPOINT
        sync: false
      - key: HWCLOUD_PROJECT_ID
        sync: false
      - key: HWCLOUD_AK
        sync: false
      - key: HWCLOUD_SK
        sync: false
      - key: HWCLOUD_DEVICE_ID
        sync: false
      - key: HWCLOUD_PRODUCT_ID
        sync: false
      - key: HWCLOUD_SERVICE_ID
        value: "Rets2"
      - key: HWCLOUD_INSTANCE_ID
        sync: false
      - key: HWCLOUD_APP_ID
        sync: false
      - key: TARGET_ONLINE_WAIT_MS
        value: "15000"
      - key: TARGET_ONLINE_POLL_MS
        value: "1500"
      - key: STRICT_TARGET_ONLINE_CHECK
        value: "false"
      - key: CLOUD_DISPATCH_RETRY_ATTEMPTS
        value: "3"
      - key: CLOUD_DISPATCH_RETRY_INTERVAL_MS
        value: "2000"
      - key: PROPERTY_POLL_ON_CONNECT
        value: "true"
      - key: PROPERTY_POLL_INTERVAL_MS
        value: "2000"
      - key: AUTO_CONNECT_ON_START
        value: "true"
